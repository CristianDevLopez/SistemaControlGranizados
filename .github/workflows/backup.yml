name: Respaldo cifrado Dexter
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: dexter-backup
  cancel-in-progress: false
jobs:
  backup:
    # Enable only after setting the secrets and verifying a restore into a separate project.
    if: vars.DEXTER_BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production-backup
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_REGION: ${{ secrets.S3_REGION }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_ALERT_URL: ${{ secrets.BACKUP_ALERT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Copia diaria a las 05 UTC; resto por hora
        run: |
          if [ "$(date -u +%H)" = '05' ]; then npm run backup -- --daily; else npm run backup; fi
      - name: Aviso de fallo
        if: failure()
        run: |
          if [ -n "$BACKUP_ALERT_URL" ]; then curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' --data '{"application":"Dexter","status":"backup_workflow_failed"}' "$BACKUP_ALERT_URL"; fi
